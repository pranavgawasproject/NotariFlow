<body>
  <!-- Loading indicator with logo -->
  <div id="loading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div style="text-align: center;">
      <img src="logo.png" alt="NotaryFlow Logo" style="width: 120px; height: 120px; margin-bottom: 24px; animation: fadeIn 0.5s ease-in; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);" />
      <div style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #ffffff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
      <p style="margin-top: 16px; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 600;">NotaryFlow</p>
      <p style="margin-top: 4px; color: rgba(255,255,255,0.8); font-family: system-ui, -apple-system, sans-serif; font-size: 14px;">Loading your workspace...</p>
    </div>
  </div>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    body { margin: 0; padding: 0; overflow: hidden; }
  </style>
  <script>
    // Remove loading screen when Flutter app loads
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.3s';
        setTimeout(() => loading.remove(), 300);
      }
    });
    
    // Fallback: remove after 10 seconds if Flutter doesn't load
    setTimeout(function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.5s';
        setTimeout(() => loading.remove(), 500);
      }
    }, 10000);
  </script>

  <script>
    // Alternative: Listen for main.dart.js load
    window.addEventListener('load', function() {
      setTimeout(function() {
        const loading = document.getElementById('loading');
        if (loading && document.querySelector('flutter-view, flt-glass-pane')) {
          loading.style.opacity = '0';
          loading.style.transition = 'opacity 0.3s';
          setTimeout(() => loading.remove(), 300);
        }
      }, 2000);
    });
  </script>
